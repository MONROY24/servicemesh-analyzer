[workspace]
members = [
    "core",
    "api"
]

resolver = "2"

[package]
name = "servicemesh-analyzer-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serde_json = "1"