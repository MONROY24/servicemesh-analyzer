[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
mesh_core = { package = "core", path = "../core" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }

serde     = { version = "1", features = ["derive"] }
serde_json = "1"

sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "macros", "uuid", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde"] }

dotenvy = "0.15"

tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
